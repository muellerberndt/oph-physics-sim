name: Primitive Source Reads

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Enable long simulator paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q tests/test_primitive_source_reads.py tests/test_ordered_port_response_diagnostic.py tests/test_physical_h3_kms_source_capture.py
      - run: python -m oph_fpe.bulk.primitive_source_reads runs/primitive-source-reads.json
      - run: python -m oph_fpe.bulk.verify_primitive_source_reads_independent runs/primitive-source-reads.json --source-root .
